<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — Let it go</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#e6dfc8}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}
.k-trail{fill:none;stroke:rgba(230,223,200,0.55);stroke-width:2;stroke-dasharray:4 7;stroke-linecap:round;animation:kDash 1.4s linear infinite}
@keyframes kDash{to{stroke-dashoffset:-22}}
.k-plane{offset-path:path('M 168 150 C 226 140, 250 70, 326 14');offset-rotate:auto;offset-anchor:50% 50%;animation:kFly 4s ease-in-out infinite}
@keyframes kFly{0%{offset-distance:0%;opacity:0;transform:scale(.7)}12%{opacity:.3}80%{opacity:.3;transform:scale(1)}100%{offset-distance:100%;opacity:0;transform:scale(.85)}}
@media (prefers-reduced-motion: reduce){.k-trail,.k-plane{animation:none}.k-plane{offset-distance:70%;opacity:.3}}
</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
<script src="kairos.js" defer></script>
</head>
<body>
<div class="stage">
<main class="phone">
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 36px; display: flex; flex-direction: column; gap: 24px; background: repeating-radial-gradient(circle at 92% 6%, rgba(230,223,200,0.06) 0 1px, rgba(0,0,0,0) 1px 26px), repeating-radial-gradient(circle at 0% 100%, rgba(230,223,200,0.05) 0 1px, rgba(0,0,0,0) 1px 34px), linear-gradient(165deg, #2c3824 0%, #1c2118 55%, #33402a 100%); color: #e6dfc8; font-family: Inter, system-ui, sans-serif">
<a href="Keep.html" aria-label="Back" style="position: absolute; left: 10px; top: 8px; z-index: 2; display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 10px; font: 600 15px Inter, sans-serif; color: #e6dfc8; text-decoration: none"><span aria-hidden="true" style="font-size: 26px; line-height: 1; margin-top: -3px">‹</span>Back</a><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: rgba(230,223,200,0.75)">Let it go</p><h1 style="margin: 0; font-family: 'Stardos Stencil', Impact, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 36px; line-height: 1.05">Let it go?</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(230,223,200,0.88)">Some moments are better just lived. This one won't be saved, and Kairos won't ask about it again.</p><div aria-hidden="true" style="position: relative; align-self: center; flex: none; width: 334px; height: 250px; margin-top: 10px"><svg width="334" height="250" style="position: absolute; left: 0; top: 0; overflow: visible"><path class="k-trail" d="M 168 150 C 226 140, 250 70, 326 14"></path></svg><div style="position: absolute; left: 30px; top: 30px; width: 200px; height: 170px; box-sizing: border-box; padding: 16px 18px; border-radius: 4px; background: repeating-linear-gradient(to bottom, #6b6e5d 0 27px, #5c5f4e 27px 28px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); transform: rotate(4deg); font-family: 'Caveat', cursive; font-size: 21px; line-height: 28px; color: #3e4334">Late dinner with<br>the squad…</div><div class="k-plane" style="position: absolute; left: 0; top: 0; width: 34px; height: 22px"><div style="position: absolute; inset: 0; background: #efe7cf; clip-path: polygon(100% 50%, 0 0, 30% 50%, 0 100%)"></div><div style="position: absolute; inset: 0; background: #c9bd93; clip-path: polygon(100% 50%, 30% 50%, 0 100%)"></div></div></div><div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px"><a data-action="let-go" href="Home.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 6px; background: #e6dfc8; color: #1f241a; font: 600 16px Inter, sans-serif; text-decoration: none">Let it go</a><a href="Keep.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 6px; border: 1px solid rgba(230,223,200,0.4); color: #e6dfc8; font: 600 16px Inter, sans-serif; text-decoration: none">Keep it after all</a></div>
</div>
</main>
</div>
<nav class="demo-nav" aria-label="Demo"><a href="index.html">Restart demo</a><a href="../index.html">About Kairos</a></nav>
</body>
</html>
