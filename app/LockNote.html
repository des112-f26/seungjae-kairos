<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — Lock screen notification</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#e6dfc8}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}

</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
</head>
<body>
<div class="stage">
<main class="phone">
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 36px; display: flex; flex-direction: column; gap: 16px; background: #000000; color: #e6dfc8; font-family: Inter, system-ui, sans-serif">

-radius: 1px; background: #d8cfa8; transform: rotate(180deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 30px; width: 2px; height: 4px; margin-top: -2px; border-radius: 1px; background: #d8cfa8; transform: rotate(210deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 30px; width: 2px; height: 4px; margin-top: -2px; border-radius: 1px; background: #d8cfa8; transform: rotate(240deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 30px; width: 2px; height: 6px; margin-top: -3px; border-radius: 1px; background: #d8cfa8; transform: rotate(270deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 30px; width: 2px; height: 4px; margin-top: -2px; border-radius: 1px; background: #d8cfa8; transform: rotate(300deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 30px; width: 2px; height: 4px; margin-top: -2px; border-radius: 1px; background: #d8cfa8; transform: rotate(330deg) translateY(-19px)"></span><span style="position: absolute; left: 31px; top: 18px; width: 2.5px; height: 14px; border-radius: 2px; background: #1c200f; transform-origin: 50% 100%; transform: rotate(40deg)"></span><span style="position: absolute; left: 31px; top: 22px; width: 3px; height: 10px; border-radius: 2px; background: #1c200f; transform-origin: 50% 100%; transform: rotate(-70deg)"></span><span style="position: absolute; left: 6px; top: 26px; width: 52px; height: 12px; background: rgba(232,224,196,0.55); clip-path: polygon(0 30%, 24% 18%, 24% 8%, 70% 8%, 70% 32%, 100% 40%, 100% 60%, 70% 62%, 60% 62%, 58% 100%, 50% 100%, 52% 62%, 40% 62%, 36% 96%, 30% 96%, 32% 62%, 24% 72%, 0 100%); transform: rotate(-40deg)"></span><span style="position: absolute; left: 6px; top: 26px; width: 52px; height: 12px; background: rgba(232,224,196,0.55); clip-path: polygon(0 30%, 24% 18%, 24% 8%, 70% 8%, 70% 32%, 100% 40%, 100% 60%, 70% 62%, 60% 62%, 58% 100%, 50% 100%, 52% 62%, 40% 62%, 36% 96%, 30% 96%, 32% 62%, 24% 72%, 0 100%); transform: rotate(40deg) scaleX(-1)"></span></span></span></span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 15px; font-weight: 600; color: #f2f2f2">Kairos</span><span style="margin-left: auto; font-size: 13px; color: rgba(242,242,242,0.6)">now</span></span>
      <span style="font-size: 15px; font-weight: 600; color: #f2f2f2">You were away for a while.</span>
      <span style="font-size: 15px; line-height: 1.35; color: rgba(242,242,242,0.85)">It looks like you spent some time with your unit. If it meant something, save it before you forget.</span>
      <span style="margin-top: 4px; font-size: 12px; color: rgba(242,242,242,0.55)">Delivered quietly</span>
    </span>
  </a><a href="LockOptions.html" style="align-self: center; display: flex; align-items: center; min-height: 44px; font-size: 13px; color: rgba(242,242,242,0.7); text-decoration: none">Press and hold for options</a></div><div style="width: 100%; box-sizing: border-box; padding: 0 34px; display: flex; justify-content: space-between"><span aria-hidden="true" style="width: 50px; height: 50px; border-radius: 50%; background: rgba(58,58,60,0.7)"></span><span aria-hidden="true" style="width: 50px; height: 50px; border-radius: 50%; background: rgba(58,58,60,0.7)"></span></div><span aria-hidden="true" style="align-self: center; width: 134px; height: 5px; border-radius: 3px; background: rgba(242,242,242,0.85)"></span>
</div>
</main>
</div>

</html>
