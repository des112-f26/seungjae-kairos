<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Kairos — What was it?</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#2b2a26}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}

</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
<script src="kairos.js" defer></script>
</head>
<body>

r, sans-serif; text-decoration: none">Mess hall</button><button aria-pressed="false" data-value="Training" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #9a9479; background: transparent; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">Training</button><button aria-pressed="false" data-value="Something else" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #9a9479; background: transparent; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">Something else</button></fieldset><div style="display: flex; flex-direction: column; gap: 10px"><label for="what" style="font-size: 14px; font-weight: 500">In a few words</label><textarea id="what" rows="4" style="padding: 14px 16px; border-radius: 6px; border: 1px solid #9a9479; background: #f1ecdb; font: 400 17px/1.45 Inter, sans-serif; color: #1f241a; resize: none">Late dinner with my squad after drills. We couldn't stop laughing.</textarea></div><a href="WhoWasThere.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid rgba(31,36,26,0.14); text-decoration: none; color: inherit"><span style="font-size: 15px; font-weight: 500">Who was there</span><span style="margin-left: auto; font-size: 14px; color: #4e5144"><span data-bind="who">Kim, Park, Lee</span></span><span aria-hidden="true" style="font-size: 16px; opacity: .6">›</span></a><div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px"><a href="Keep.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 6px; background: #1f241a; color: #e6dfc8; font: 600 16px Inter, sans-serif; text-decoration: none">Next</a></div>
