<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — Not a moment</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#2b2a26}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}

</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
<script src="kairos.js" defer></script>
</head>
<body>
<div class="stage">
<main class="phone">
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 36px; display: flex; flex-direction: column; gap: 24px; background: repeating-radial-gradient(circle at 92% 6%, rgba(76,90,46,0.10) 0 1px, rgba(0,0,0,0) 1px 26px), repeating-radial-gradient(circle at 0% 100%, rgba(76,90,46,0.07) 0 1px, rgba(0,0,0,0) 1px 34px), linear-gradient(165deg, #efe9d3 0%, #e4dcbf 50%, #cfc79e 100%); color: #1f241a; font-family: Inter, system-ui, sans-serif">
<a href="Nudge.html" aria-label="Back" style="position: absolute; left: 10px; top: 8px; z-index: 2; display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 10px; font: 600 15px Inter, sans-serif; color: #1f241a; text-decoration: none"><span aria-hidden="true" style="font-size: 26px; line-height: 1; margin-top: -3px">‹</span>Back</a><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #5a5d4c">Noted</p><h1 style="margin: 0; font-family: 'Stardos Stencil', Impact, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 30px; line-height: 1.05">That's okay, not every hour has to mean something</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4e5144">Kairos learns which breaks you'd rather keep to yourself.</p><label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 6px; border: 1px solid #9a9479; font-size: 15px; font-weight: 500"><input id="noask" type="checkbox" checked style="width: 20px; height: 20px; accent-color: #6b7a3f">Don't ask after this kind of break again</label><div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px"><a href="Home.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 6px; background: #1f241a; color: #e6dfc8; font: 600 16px Inter, sans-serif; text-decoration: none">Back to today</a><a href="Moment.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 6px; color: #1f241a; font: 500 15px Inter, sans-serif; text-decoration: none">Actually, keep it</a></div>
</div>
</main>
</div>
<nav class="demo-nav" aria-label="Demo"><a href="index.html">Restart demo</a><a href="../index.html">About Kairos</a></nav>
</body>
</html>
