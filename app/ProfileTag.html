<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — Profile: your tag</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#2b2a26}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}

</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
</head>
<body>
<div class="stage">
<main class="phone">

a(255,255,255,0.5)">PVT · 2ND SQUAD</span><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .1em; line-height: 1.7; text-shadow: 0 1px 0 rgba(255,255,255,0.5)">KAIROS · D-214</span></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="pname" style="font-size: 14px; font-weight: 500">Name</label><input id="pname" type="text" value="Seungjae Chang" style="min-height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #9a9479; background: #f1ecdb; font: 400 16px Inter, sans-serif; color: #1f241a"></div><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 10px"><legend style="margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #5a5d4c">Rank</legend><button aria-pressed="true" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #b8963e; background: #b8963e; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">Pvt.</button><button aria-pressed="false" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #9a9479; background: transparent; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">PFC</button><button aria-pressed="false" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #9a9479; background: transparent; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">Cpl.</button><button aria-pressed="false" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #9a9479; background: transparent; color: #1f241a; font: 500 14px Inter, sans-serif; text-decoration: none">Sgt.</button></fieldset><div style="display: flex; flex-direction: column; gap: 6px"><label for="punit" style="font-size: 14px; font-weight: 500">Unit</label><input id="punit" type="text" value="2nd squad" style="min-height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #9a9479; background: #f1ecdb; font: 400 16px Inter, sans-serif; color: #1f241a"></div><fieldset style="margin: 0; padding: 0; border: 0; display: flex; align-items: center; gap: 14px"><legend style="margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #5a5d4c">Badge color</legend><button aria-label="Olive" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #4c5a2e; box-shadow: 0 0 0 3px #e6dfc8, 0 0 0 5px #1f241a"></button><button aria-label="Brass" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #b8963e; box-shadow: 0 0 0 1px #9a9479"></button><button aria-label="Coyote" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #8a7a4e; box-shadow: 0 0 0 1px #9a9479"></button><button aria-label="Black" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1f241a; box-shadow: 0 0 0 1px #9a9479"></button></fieldset><div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px"><a href="ProfileDates.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 6px; background: #1f241a; color: #e6dfc8; font: 600 16px Inter, sans-serif; text-decoration: none">Next</a></div>
