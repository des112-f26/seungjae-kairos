<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos — Settings</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{background:#11150f}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.stage{position:relative;flex:none;width:calc(390px * var(--s, 1));height:calc(844px * var(--s, 1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2a3322,0 30px 80px rgba(0,0,0,.55);transform:scale(var(--s, 1));transform-origin:0 0}
.demo-nav{display:flex;gap:18px;font:500 13px Inter,system-ui,sans-serif}
.demo-nav a{color:#d4b26a;text-decoration:none;padding:10px 4px}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:500px){body{padding:0;justify-content:flex-start;gap:0}.phone{border-radius:0;box-shadow:none}.demo-nav{padding:8px 0 16px}}

body{margin:0}
a{color:#2b2a26}a:hover{opacity:.8}
input[type=range]{accent-color:#6b7a3f}

</style>
<script>(function(){function fit(){var m=window.innerWidth<=500;var w=window.innerWidth-(m?0:60),h=window.innerHeight-(m?0:110);var s=m?w/390:Math.min(1,w/390,h/844);document.documentElement.style.setProperty('--s',s.toFixed(4))}fit();window.addEventListener('resize',fit)})();</script>
</head>
<body>

y: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid rgba(31,36,26,0.14); text-decoration: none; color: inherit"><span style="font-size: 15px; font-weight: 500">Tonight opens</span><span style="margin-left: auto; font-size: 14px; color: #4e5144">After phones are collected</span></div><a href="SilentInfo.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid rgba(31,36,26,0.14); text-decoration: none; color: inherit"><span style="font-size: 15px; font-weight: 500">Always silent</span><span style="margin-left: auto; font-size: 14px; color: #4e5144">On · locked</span><span aria-hidden="true" style="font-size: 16px; opacity: .6">›</span></a></div><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4e5144">Kairos keeps your moments on this phone only.</p>

</body>
</html>
